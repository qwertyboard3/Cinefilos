# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "3-58/5 * * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync Trakt movie list
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          if [ -z "$TRAKT_CLIENT_ID" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "::notice::Trakt sync will start after TRAKT_CLIENT_ID is configured."
            exit 0
          fi
          python3 .github/sync_trakt.py
      - name: Check for newly imported movies
        id: imports
        run: |
          git add -- Cinefilos/assets/trakt-movies.js
          if [ -d Cinefilos/posters/trakt ]; then
            git add -- Cinefilos/posters/trakt
          fi
          if ! git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Pages
        if: github.event_name != 'schedule' || steps.imports.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'schedule' || steps.imports.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './Cinefilos'
      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.imports.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Save newly imported movies
        if: steps.imports.outputs.changed == 'true'
        run: |
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Sync Cinefilos movies from Trakt"
          git push origin HEAD:main
