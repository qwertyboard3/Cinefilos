<!DOCTYPE html>
<html lang="en">
<head>


  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>cinefilos</title>

<!-- Manifest -->
<link rel="manifest" href="assets/manifest.json">

<!-- Theme Color -->
<meta name="theme-color" content="#111111">

<!-- Chrome / Android -->
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS Safari (still supported for now) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cinéfilos">
<meta name="apple-touch-icon" href="assets/icons/icon-192.png">


  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .header-image {
      max-width: 300px;
      height: auto;
      margin: 10px auto;
      display: block;
    }

    .centered-container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .coverflow-container {
      perspective: 1200px;
      height: 350px;
      margin: 30px 0 40px;
      overflow-x: hidden;
      -webkit-box-reflect: below 1px linear-gradient(transparent, rgba(255,255,255,0.3));
    }

    .coverflow-container.loaded .poster {
      opacity: 1;
    }

    #posterFlow {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .button-container button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .button-container img {
      display: block;
      width: 160px;
      height: auto;
    }

    #history {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin: 10px auto;
      padding: 0;
      list-style: none;
      max-width: 800px;
    }

    #history li {
      background: #222;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 8px #000;
      min-width: 180px;
    }

    #history img {
      max-height: 180px;
      border-radius: 6px;
      margin-top: 8px;
    }

.pressed {
  animation: pressEffect 0.1s ease-in-out;
}

@keyframes pressEffect {
  0% { transform: scale(1); }
  50% { transform: scale(0.95); }
  100% { transform: scale(1); }
}

button:active {
  transform: scale(0.95);
  box-shadow: inset 0px 0px 5px rgba(0, 0, 0, 0.2);
}
button:hover {
  animation: pulse 0.6s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.07); }
  100% { transform: scale(1); }
}

.poster:hover,
.poster:focus {
  transform: scale(2.5);
  filter: brightness(1.1);
}

  </style>
<link rel="stylesheet" href="assets/movie-card.css">
</head>
<body>

    <a href="index.html">
  <img src="assets/cinefilos.png" alt="Cinefilos" class="header-image">
</a>

  <div class="centered-container">
    <div class="coverflow-container">
      <div id="posterFlow"></div>
    </div>

    <div class="button-container">
      <button id="randomPick">
        <img src="assets/Button2.PNG" alt="Random Movie">
      </button>
      <button id="clearHistory">
        <img src="assets/Button.PNG" alt="Clear History">
      </button>
    </div>
  </div>

  <ul id="history"></ul>
  <audio id="soundPick" src="assets/sounds/pick.wav"></audio>

<!-------------------------------------------------------------------------------------------------------script---------------------------------------------------------------------------------------------------------------------->
<script src="assets/posters.js" defer></script>
<script src="assets/runtime.js" defer></script>
<script src="assets/titles.js" defer></script>
<script src="assets/entries2.js" defer></script>
<script src="assets/years.js" defer></script>
<script src="assets/script.js" defer></script>


<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/Cinefilos/assets/sw.js', { scope: '/Cinefilos/' })
    .then(reg => console.log('SW Registered:', reg))
    .catch(err => console.error('SW Registration failed:', err));
}
</script>


</body>
</html>
